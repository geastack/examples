name: Bouncing Balls performance gate tests
on:
  push:
    branches: [main]
    paths: ['scripts/**', 'apps/bouncing-balls-jsx/**', '.github/workflows/bouncing-balls-gate.yml']
  pull_request:
    paths: ['scripts/**', 'apps/bouncing-balls-jsx/**', '.github/workflows/bouncing-balls-gate.yml']
permissions:
  contents: read
jobs:
  gate-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run test:balls:gate
