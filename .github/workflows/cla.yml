name: CLA

# Calls the organisation-wide CLA workflow in geastack/.github. The agreement
# text and the signature record live there; a contributor signs once and it
# counts for every geastack repository. CLA_SIGNATURES_TOKEN is an org secret.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, reopened, closed]

permissions:
  actions: write
  contents: read
  pull-requests: write
  statuses: write

jobs:
  cla:
    if: |
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request != null &&
       (github.event.comment.body == 'recheck' ||
        github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    uses: geastack/.github/.github/workflows/cla.yml@main
    secrets: inherit
